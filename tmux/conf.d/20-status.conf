# ---------------------------------------------------------------------------
# Status bar -- kanagawa-dragon palette, matched to the nvim theme
# ---------------------------------------------------------------------------
#
#   bg #181616   bg2 #282727   bg3 #393836   fg #c5c9c5   gray #a6a69c
#   dim #7a8382  red #c4746e   orange #b6927b  yellow #c4b28a
#   green #87a987  aqua #8ea4a2  blue #8ba4b0  violet #8992a7
#
# Layout:
#   [session][host]  1 name  2 name  3 name        cmd  cwd | HH:MM
#    ^ accent block   ^ current window highlighted   ^ right side
#
# The accent colour is blue locally and orange over ssh, so a remote session is
# obvious at a glance. It flips to red while the prefix key is held.
if -b '[ -n "$SSH_CONNECTION" ]' \
  'set -g @accent "#b6927b"' \
  'set -g @accent "#8ba4b0"'

set -g status on
set -g status-interval 5          # only the clock needs refreshing
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#181616,fg=#a6a69c'

set -g status-left-length 60
set -g status-right-length 80

# Left: session name on the accent block, then the machine on a dim block.
set -g status-left \
'#[fg=#181616,bg=#{?client_prefix,#c4746e,#{@accent}},bold] #S \
#[fg=#c5c9c5,bg=#282727,nobold] #h \
#[fg=#282727,bg=#181616,nobold] '

# Right: what the focused pane is running, the directory it is in, the clock.
set -g status-right \
'#[fg=#7a8382]#{pane_current_command} \
#[fg=#393836]│ #[fg=#8ea4a2]#{b:pane_current_path} \
#[fg=#c5c9c5,bg=#282727] %H:%M \
#[fg=#181616,bg=#{@accent},bold] %d %b '

# Inactive window: dim, with a dot when something printed while you were away.
setw -g window-status-format \
'#[fg=#7a8382,bg=#181616] #I #[fg=#a6a69c]#W#[fg=#c4b28a]#{?window_activity_flag, •,} '
setw -g window-status-current-format \
'#[fg=#181616,bg=#c5c9c5,bold] #I #W#{?window_zoomed_flag, +,} '

setw -g window-status-separator ''
setw -g window-status-bell-style 'fg=#c4746e,bg=#181616,bold'

# Panes: the active border picks up the accent, so the focused pane is readable
# even in a four-way split.
set -g pane-border-style 'fg=#282727'
set -g pane-active-border-style 'fg=#8ba4b0'
set -g pane-border-status off

set -g message-style 'fg=#181616,bg=#c4b28a,bold'
set -g message-command-style 'fg=#c5c9c5,bg=#282727'
setw -g mode-style 'fg=#181616,bg=#8ea4a2'
setw -g clock-mode-colour '#8ba4b0'
