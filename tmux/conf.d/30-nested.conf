# ---------------------------------------------------------------------------
# Nested tmux
# ---------------------------------------------------------------------------
#
# The old setup ran a second tmux server on a random socket and swapped whole
# config files back and forth through $TMUX_PARENT. That is what made it fragile:
# the two servers could disagree about who was active, and a detach left the
# outer session with the wrong bindings.
#
# This replaces it with the standard "off mode". F12 makes the OUTER tmux
# ignore every key -- prefix included -- so all input falls through to whatever
# is inside: a nested local tmux, or a tmux on the far end of an ssh session.
# F12 again takes control back. One server, no sockets, no state to desync.
#
# While off, the status bar collapses to a single dim OFF marker, so there is
# never any doubt about which tmux is listening.

bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=#12120f,fg=#7a8382' \;\
  set status-left '#[fg=#12120f,bg=#7a8382,bold] OFF #[fg=#7a8382,bg=#12120f] #S ' \;\
  set status-right '#[fg=#7a8382]F12 to resume ' \;\
  setw window-status-current-format '#[fg=#7a8382,bg=#12120f] #I #W ' \;\
  setw window-status-format '#[fg=#393836,bg=#12120f] #I #W ' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u status-right \;\
  setw -u window-status-current-format \;\
  setw -u window-status-format \;\
  refresh-client -S

# C-e N : start a genuinely nested tmux server in a new window. Useful for
# rehearsing a config change without touching the session you are working in.
# The inner server gets its own socket and is disposable.
bind N new-window -n 'nested' \
  'tmux -L nested-#{pid} new-session -A -s nested'
