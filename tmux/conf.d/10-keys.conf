# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------

# Prefix: C-e. C-b collides with vim page-up, C-a with readline line-start.
unbind C-b
set -g prefix C-e
bind C-e last-window          # C-e C-e flips between the two windows in play
bind e send-prefix            # C-e e sends a literal C-e through to the program

bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# --- windows ---------------------------------------------------------------

# C-e t : new window, prompt for a name, append at the end.
bind t command-prompt -p 'name:' \
  'new-window -n "%%" -c "#{pane_current_path}"'

# C-e T : new window at the index you type.
#   index in use   -> -b inserts before it, pushing the rest right
#   index past end -> the window is created at exactly that index, leaving a gap
# Do NOT add `move-window -r` here. It renumbers straight away, which collapses
# a deliberate gap back to the end -- i.e. it turns "put this at 6" into an
# ordinary append.
bind T command-prompt -p 'name:','index:' \
  'new-window -b -n "%1" -t "%2" -c "#{pane_current_path}"'

# C-e A : rename the current window, pre-filled with the current name.
bind A command-prompt -I '#W' 'rename-window -- "%%"'

bind p previous-window
bind n next-window
bind -r H swap-window -t -1 \; select-window -t -1   # -r: repeatable, drag left
bind -r L swap-window -t +1 \; select-window -t +1

bind w choose-tree -Zw        # visual window/session picker
bind X confirm-before -p 'kill window #W? (y/n)' kill-window

# --- panes -----------------------------------------------------------------

# | and - are mnemonic for the resulting split. % and " are the tmux defaults
# and stay bound so existing muscle memory keeps working -- but rebound rather
# than left alone, so that every split inherits the current directory. The
# stock % and " open in $HOME, which is almost never what you want.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 3
bind -r Up    resize-pane -U 3
bind -r Right resize-pane -R 5

bind z resize-pane -Z         # zoom (default, restated for discoverability)
bind Space next-layout

# --- sessions --------------------------------------------------------------

bind S command-prompt -p 'session:' 'new-session -s "%%"'
bind ( switch-client -p
bind ) switch-client -n

# --- copy mode -------------------------------------------------------------

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# / searches backward through scrollback, which is where the output you want
# almost always is.
bind -T copy-mode-vi / command-prompt -i -p '(search up)' \
  'send -X search-backward-incremental "%%%"'
bind -T copy-mode-vi ? command-prompt -i -p '(search down)' \
  'send -X search-forward-incremental "%%%"'
