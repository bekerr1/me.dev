# ---------------------------------------------------------------------------
# Persistence -- tmux-resurrect + tmux-continuum
# ---------------------------------------------------------------------------
#
# Sessions here are long-lived: some have been open for weeks and represent real
# working context (window names, layouts, working directories). A reboot should
# not cost that -- especially on a VPS, where the reboot is somebody else's
# decision.
#
#   resurrect   saves and restores the session tree on demand
#   continuum   drives resurrect on a timer and restores on server start
#
# Installed as pinned clones by install.d/tmux.sh, not through TPM. TPM needs an
# interactive `prefix + I` to install anything, which defeats a one-shot setup.

set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Restore the shell and its working directory, plus editors and pagers.
#
# Deliberately NOT the coding agents. resurrect can relaunch arbitrary programs,
# but bringing claude/codex/pi back automatically across every agent window on
# every boot spends tokens and produces agents with no idea what they were doing.
# The useful part is the cwd; you start the agent yourself.
#
# The default list already covers vi/vim/nvim/emacs/man/less/more/tail/top/htop.
# Add to it here if something else is worth restoring; prefix a name with ~ to
# restore its full command line rather than just the program.
set -g @resurrect-processes 'false'
set -ga @resurrect-processes ' "~nvim" "~vim" "less" "man" "tail" "htop" "top"'

# Save what was on screen in each pane, so a restored session looks like the one
# you left rather than a wall of fresh prompts. Bounded by history-limit (50k
# here), so the save file grows with pane count -- see docs if it gets large.
set -g @resurrect-capture-pane-contents 'on'

# Keep window indices exactly as saved. This matters: window 6 is deliberately
# empty and the agent block starts at 7 (see 00-options.conf), and a restore that
# renumbered would quietly destroy that.
set -g @resurrect-hook-post-save-all 'true'

# continuum: save every 15 minutes, restore automatically when the server starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# @continuum-boot would start tmux at system boot via launchd/systemd. Left off
# here and enabled per-machine in ~/.config/me/tmux.local.conf -- it is right for
# an always-on VPS and wrong for a laptop.

# prefix C-s  save now      prefix C-r  restore
# Both are bound by resurrect itself. C-s was the old nested-tmux binding; that
# is gone (nesting is F12 now), so there is no conflict.

# continuum must load after resurrect -- it drives it.
run-shell -b '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell -b '~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux'
