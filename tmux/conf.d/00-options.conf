# ---------------------------------------------------------------------------
# General options
# ---------------------------------------------------------------------------

set -g history-limit 50000
set -g display-time 2000          # how long status messages linger
set -g display-panes-time 2000
set -g escape-time 10             # 0 breaks some terminals; 10ms is safe and
                                  # still fast enough that Esc in nvim is instant
set -g mouse on
set -s extended-keys on
set -s extended-keys-format csi-u

# focus-events is deliberately NOT enabled. It buys nvim autoread and a gitsigns
# refresh on focus, and costs the prefix key: with ghostty it desyncs focus
# tracking on newly attached clients, which then swallow the first C-e. A
# terminal that needs two presses to reach the prefix is not worth an autoread.
set -g set-clipboard on

# Windows and panes count from 1 -- the 0 key is a long reach.
set -g base-index 1
setw -g pane-base-index 1

# renumber-windows stays OFF. Window indices here are chosen deliberately (see
# C-e T), and gaps are meaningful: window 6 stays window 6 whatever happens to
# window 2. Turning it on silently reshuffles those positions on every close.
set -g renumber-windows off

setw -g automatic-rename off      # window names are set deliberately, via C-e t
set -g allow-rename off           # ...and shells must not overwrite them
set -g set-titles on
set -g set-titles-string '#S:#I #W'

setw -g mode-keys vi
set -g status-keys emacs          # readline bindings at the tmux command prompt

# Colour. tmux-256color is the correct terminfo for tmux >= 2.9 but is missing
# on stock macOS; fall back rather than losing colour entirely.
if -b 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc,xterm-kitty:Tc"

# Do not force a shell; use the login shell so PATH and rc files behave.
set -g default-command "${SHELL}"

# Activity is informational only -- no bells, no flashing.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity on       # drives the subtle dot in the status bar
