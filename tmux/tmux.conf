# ~/.tmux.conf -> me/tmux/tmux.conf
#
# Loader. install.sh guarantees the repo is reachable at ~/.config/me/root,
# so the fragments below can be sourced by absolute path.

source-file -q ~/.config/me/root/tmux/conf.d/00-options.conf
source-file -q ~/.config/me/root/tmux/conf.d/10-keys.conf
source-file -q ~/.config/me/root/tmux/conf.d/20-status.conf
source-file -q ~/.config/me/root/tmux/conf.d/30-nested.conf
source-file -q ~/.config/me/root/tmux/conf.d/40-persist.conf

# Machine-local overrides, not tracked by git.
source-file -q ~/.config/me/tmux.local.conf
